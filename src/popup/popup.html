<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PinInfo</title><link rel="stylesheet" href="popup.css"></head><body><main class="app"><header class="brand"><img src="../../assets/icon.svg" alt="PinInfo" class="logo"><div><div class="wordmark"><span>Pin</span>Info</div><div class="tagline">PINTEREST RESEARCH</div></div><span class="live-dot"></span></header><section class="hero"><div><div class="eyebrow">RESEARCH WORKSPACE</div><h1>Find the Pins<br><span>worth studying.</span></h1></div><div class="hero-icon">⌕</div></section><section class="stats"><div class="stat"><span class="stat-icon">◉</span><strong id="researchCount">0</strong><small>Research</small></div><div class="stat"><span class="stat-icon star">★</span><strong id="favoriteCount">0</strong><small>Favorites</small></div><div class="stat"><span class="stat-icon">↗</span><strong id="pageCount">0</strong><small>Sources</small></div></section><section class="actions"><button id="exportCsv" class="primary"><span>↓</span> Export CSV</button><button id="exportJson" class="secondary"><span>{ }</span> Export JSON</button></section><section class="quick"><div class="section-title"><span>QUICK ACTIONS</span><span class="version">v0.1.1</span></div><button id="diagnostic" class="quick-button"><span class="q-icon">⌁</span><div><b>Run Pinterest Diagnostic</b><small>Inspect observable Pin data</small></div><span>›</span></button><button id="clearResearch" class="quick-button danger"><span class="q-icon">⌫</span><div><b>Clear Research</b><small>Remove saved research data</small></div><span>›</span></button><button id="clearFavorites" class="quick-button danger"><span class="q-icon">★</span><div><b>Clear Favorites</b><small>Remove all starred Pins</small></div><span>›</span></button></section><footer><span class="status-pill"><i></i> PINTEREST READY</span><span>Local data only</span></footer></main><script src="popup.js"></script></body></html>
